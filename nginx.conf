# nginx.conf
# -----------------------------------------------------------------------------
# Minimal nginx site config for serving the built React SPA.
# -----------------------------------------------------------------------------

server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # Compress text-based assets for faster delivery.
    gzip on;
    gzip_types text/plain text/css application/javascript application/json
               image/svg+xml application/xml;
    gzip_min_length 512;

    # Cache hashed build assets (Vite fingerprints filenames) aggressively —
    # they're safe to cache forever because a content change produces a new
    # filename.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # Everything else (including the SPA's single entry route "/") falls
    # back to index.html. This app only uses hash-based anchor links
    # (#about, #projects, etc.) rather than a client-side router, so in
    # practice this fallback is mainly relevant for direct hits on "/".
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Don't serve dotfiles.
    location ~ /\. {
        deny all;
    }
}
